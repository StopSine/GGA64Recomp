# RSP audio microcode recompilation, producing rsp/aspMain.cpp.
#
# Goemon's Great Adventure ships the same aspMain as Mystical Ninja: all 0xE20
# bytes are identical, at 0x264D0 here against 0x546B0 there, and it appears
# exactly once. This used to read the Mystical Ninja ROM because that is where
# the microcode was first extracted from, which meant a build needed a second
# game's ROM for nothing.
#
# rsp/aspMain.cpp is not tracked, so a fresh clone runs RSPRecomp over this to
# produce it.
text_offset = 0x264D0
text_size = 0xE20
text_address = 0x04001080
rom_file_path = "lib/gga/config/usa/baserom.decompressed.z64"
output_file_path = "rsp/aspMain.cpp"
output_function_name = "aspMain"
extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C,
]
