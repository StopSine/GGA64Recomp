# RSP audio microcode recompilation, producing rsp/aspMain.cpp.
#
# NOTE: the offset below is into the Mystical Ninja ROM, which is where this
# microcode was originally extracted from, and the generated rsp/aspMain.cpp is
# compiled into the Goemon's Great Adventure build as-is. Whether GGA ships the
# same audio microcode has not been verified. If GGA's differs, this needs
# re-extracting from the GGA ROM at its own offset. rsp/aspMain.cpp is not
# tracked, so a fresh clone has to run RSPRecomp over a ROM to produce it.
text_offset = 0x546B0
text_size = 0xE20
text_address = 0x04001080
rom_file_path = "mnsg.z64"
output_file_path = "rsp/aspMain.cpp"
output_function_name = "aspMain"
extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C,
]
